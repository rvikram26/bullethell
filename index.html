<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="description" content="Lantern Tide - an original vertical-scrolling bullet-hell shooter." />
    <title>Lantern Tide</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b0f26'/%3E%3Crect x='10' y='8' width='12' height='17' rx='2' fill='%23ffd27a'/%3E%3Cpath d='M16 11c3 4 3 8 0 11c-3-3-3-7 0-11z' fill='%23ff8a2a'/%3E%3Crect x='9' y='6' width='14' height='3' fill='%233a2a18'/%3E%3Crect x='9' y='24' width='14' height='3' fill='%233a2a18'/%3E%3C/svg%3E"
    />
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #05060d; overflow: hidden; }
      body { display: flex; align-items: center; justify-content: center; }
      #game {
        display: block;
        background: #000;
        outline: none;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        box-shadow: 0 0 40px rgba(80, 120, 255, 0.15);
      }
      #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
              color: #8aa; font: 14px/1.4 "Segoe UI", system-ui, sans-serif; pointer-events: none; }
      #boot.hidden { display: none; }
    </style>
  </head>
  <body>
    <div id="boot">Loading Lantern Tide&hellip;</div>
    <canvas id="game" tabindex="0"></canvas>
    <noscript>Lantern Tide needs JavaScript and an HTML5 canvas.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
